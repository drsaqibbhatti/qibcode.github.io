<!doctype html>
<html lang="en">
<head>

  <title>Page not found — QibCode</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <!-- Self-contained on purpose: GitHub Pages serves this file for any missing path,
       so it must not depend on relative asset paths. If your site lives at
       https://USER.github.io/REPO/, change the two "/" links below to "/REPO/". -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;600&display=swap">
  <style>
    :root { --bg:#fff; --ink:#10204A; --muted:#5A6478; --blue:#0047A0; --red:#CD2E3A; --line:#D9DFEA; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0B1226; --ink:#EEF1F8; --muted:#9AA6C2; --blue:#3B7BEA; --red:#F26B74; --line:#27325A; color-scheme: dark; } }
    * { box-sizing: border-box; }
    html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.6; }
    main { max-width: 34rem; }
    svg { width: 56px; height: 56px; fill: none; stroke-width: 7; stroke-linecap: round; margin-bottom: 1.5rem; }
    h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.02; letter-spacing: -.03em; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a.btn { display: inline-block; padding: .8rem 1.3rem; border-radius: 999px; background: var(--blue); color: #fff; text-decoration: none; font-weight: 600; }
    a.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .alt { display: block; margin-top: 1.25rem; color: var(--muted); font-size: .95rem; }
    .alt a { color: var(--blue); }
  </style>
</head>
<body>
